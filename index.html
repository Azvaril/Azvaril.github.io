<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="icons/favicon.ico">
    <title>Azvaril's Puzzles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <div class="brand">
                <h1>Azvaril's Puzzles</h1>
                <p class="tagline">A collection of logic puzzles to solve online</p>
            </div>
            <nav class="header-links">
                <a href="https://logic-masters.de/Raetselportal/Benutzer/allgemein.php?name=Azvaril" target="_blank" rel="noopener" aria-label="Logic Masters Profile" title="Logic Masters Profile">
                    <img src="icons/lmg.ico" alt="" class="social-icon">
                </a>
                <a href="https://www.youtube.com/@azvaril" target="_blank" rel="noopener" aria-label="YouTube Channel" title="YouTube Channel" class="youtube-link">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M23.5 6.2a3.02 3.02 0 0 0-2.12-2.14C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.56A3.02 3.02 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.12 2.14c1.88.56 9.38.56 9.38.56s7.5 0 9.38-.56a3.02 3.02 0 0 0 2.12-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <div class="controls" aria-label="Filter and sort puzzles">
        <div class="controls-row">
            <div class="sort-control">
                <label for="sort-select">Sort by</label>
                <select id="sort-select">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="diff-asc">Difficulty: low to high</option>
                    <option value="diff-desc">Difficulty: high to low</option>
                </select>
            </div>
            <button type="button" id="filters-toggle" class="btn btn-secondary" aria-expanded="false" aria-controls="filters-panel">
                Filters<span id="filters-count" class="filters-count" hidden></span>
            </button>
        </div>
    </div>

    <div class="filters-panel" id="filters-panel" hidden>
        <div class="filters-panel-header">
            <span class="tag-filter-label">Filter by variant:</span>
            <div class="filters-panel-actions">
                <button type="button" id="clear-filters" class="btn btn-secondary">Clear filters</button>
                <button type="button" id="filters-close" class="btn btn-secondary">Hide filters</button>
            </div>
        </div>
        <div class="tag-filter" id="tag-filter" role="group" aria-label="Filter by variant tag"></div>
    </div>

    <main>
        <p id="empty-state" class="empty-state" hidden>No puzzles match the selected filters. Try clearing some filters.</p>
        <section class="puzzle-list" id="puzzle-list" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
